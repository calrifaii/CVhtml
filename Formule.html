<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire d'inscription</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 5px rgba(102,126,234,0.5);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .submit-btn {
            background: #667eea;
            color: white;
        }

        .submit-btn:hover {
            background: #5a67d8;
        }

        .reset-btn {
            background: #ccc;
        }

        .reset-btn:hover {
            background: #aaa;
        }

        small {
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulaire d'inscription</h2>

    <form>
        <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text" id="nom" name="nom" required>
        </div>

        <div class="form-group">
            <label for="prenom">Prénom *</label>
            <input type="text" id="prenom" name="prenom" required>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" name="telephone" pattern="[0-9]{10}">
            <small>Format : 0612345678</small>
        </div>

        <div class="form-group">
            <label for="date">Date de naissance *</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label>Sexe *</label>
            <div class="radio-group">
                <label><input type="radio" name="sexe" value="homme" required> Homme</label>
                <label><input type="radio" name="sexe" value="femme"> Femme</label>
                <label><input type="radio" name="sexe" value="autre"> Autre</label>
            </div>
        </div>

        <div class="form-group">
            <label for="adresse">Adresse</label>
            <textarea id="adresse" name="adresse" rows="3"></textarea>
        </div>

        <div class="buttons">
            <button type="reset" class="reset-btn">Réinitialiser</button>
            <button type="submit" class="submit-btn">Envoyer</button>
        </div>
    </form>
</div>

</body>
</html>
